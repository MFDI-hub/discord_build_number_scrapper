name: Scrape Discord builds

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-discord-builds
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Scrape Discord build numbers
        id: scrape
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          SCRAPER_IMPERSONATE: ${{ vars.SCRAPER_IMPERSONATE }}
        run: uv run discord_build_number_scrapper

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update Discord build numbers [skip ci]"
            git push
          fi

      - name: Close scraper-failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Scraper succeeded again. Closing this issue.\n\n[Workflow run](${runUrl})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Open or update scraper-failure issue
        if: failure() && steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const title = "Scraper failed to find a Discord build number";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The Discord build scraper failed (network error or missing build number).\n\n[Workflow run](${runUrl})`;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "B60205",
                description: "Discord build scraper could not find a build number",
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `The scraper failed again.\n\n[Workflow run](${runUrl})`,
              });
            }
